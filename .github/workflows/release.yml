# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: Release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'casket-ssg.cabal'
      - 'src/**'
      - 'README.adoc'
      - 'LICENSE'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build prebuilt Linux artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cabal
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: linux-x86_64-cabal-${{ hashFiles('casket-ssg.cabal') }}
          restore-keys: |
            linux-x86_64-cabal-

      - name: Prepare runner Haskell toolchain
        run: |
          ghc --version
          cabal --version
          cabal update

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk '$1 == "version:" { print $2; exit }' casket-ssg.cabal)"
          test -n "${package_version}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_version="${GITHUB_REF_NAME#v}"
            if [[ "${release_version}" != "${package_version}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match cabal version ${package_version}"
              exit 1
            fi
          fi

          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"

      - name: Build optimised core executable
        run: |
          cabal build exe:casket-ssg \
            --enable-optimization=2 \
            --flags=-lol-i18n

      - name: Exercise executable and site build
        shell: bash
        run: |
          set -euo pipefail
          binary="$(cabal list-bin exe:casket-ssg \
            --enable-optimization=2 \
            --flags=-lol-i18n)"
          test -x "${binary}"
          "${binary}" --version | tee "${RUNNER_TEMP}/casket-version.txt"
          grep -F "v${PACKAGE_VERSION}" "${RUNNER_TEMP}/casket-version.txt"

          if ldd "${binary}" | grep -q 'liblol'; then
            echo "::error::The core executable unexpectedly requires liblol"
            exit 1
          fi

          smoke_root="${RUNNER_TEMP}/casket-smoke"
          mkdir -p "${smoke_root}/content"
          printf '%s\n' \
            '---' \
            'title: Release smoke test' \
            '---' \
            '# Release smoke test' \
            '' \
            'A real generated page.' \
            > "${smoke_root}/content/index.md"
          "${binary}" build "${smoke_root}/content" "${smoke_root}/site"
          test -s "${smoke_root}/site/index.html"
          grep -F '<h1 id="release-smoke-test">Release smoke test</h1>' \
            "${smoke_root}/site/index.html"

          echo "CASKET_BINARY=${binary}" >> "${GITHUB_ENV}"

      - name: Package deterministic archive
        shell: bash
        run: |
          set -euo pipefail
          package_name="casket-ssg-${PACKAGE_VERSION}-x86_64-linux"
          package_root="${RUNNER_TEMP}/package"
          package_dir="${package_root}/${package_name}"
          archive="${GITHUB_WORKSPACE}/dist/${package_name}.tar.gz"
          mkdir -p "${package_dir}" "${GITHUB_WORKSPACE}/dist"

          install -m 0755 "${CASKET_BINARY}" "${package_dir}/casket-ssg"
          strip "${package_dir}/casket-ssg"
          cp README.adoc LICENSE "${package_dir}/"

          {
            echo "casket-ssg=${PACKAGE_VERSION}"
            echo "source-revision=${GITHUB_SHA}"
            echo "target=x86_64-linux-gnu"
            echo "variant=core"
            echo "lol-i18n=disabled"
            ghc --version
            cabal --version | head -n 1
            readelf -d "${package_dir}/casket-ssg" \
              | awk '$2 == "(NEEDED)" { gsub(/[][]/, "", $5); print "needed=" $5 }'
          } > "${package_dir}/BUILD-METADATA.txt"

          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "${package_root}" \
            -cf - "${package_name}" \
            | gzip -n > "${archive}"

          archive_name="$(basename "${archive}")"
          cd "${GITHUB_WORKSPACE}/dist"
          sha256sum "${archive_name}" > "${archive_name}.sha256"
          sha256sum -c "${archive_name}.sha256"
          tar -tzf "${archive_name}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: casket-ssg-x86_64-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish immutable-tag release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: casket-ssg-x86_64-linux
          path: artifacts

      - name: Verify checksums
        working-directory: artifacts
        run: sha256sum -c -- ./*.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: artifacts/*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/*.tar.gz \
            artifacts/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Casket-SSG ${GITHUB_REF_NAME}" \
            --generate-notes
